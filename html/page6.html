<!DOCTYPE html>
<html lang = "vi">
	<head>
		<title>Học phí </title>
		<meta charset = "utf-8">
		<link rel = "stylesheet" href = "../css/style6.css">
	</head>
	<body>
		<div id="container">
            <button type="button" onclick ="add();">Thêm môn</button>
        </div>    
        <div id="hienthi" class="row">

        </div>
        <script>
            function add(){
                const myRow = document.createElement("div");
                myRow.setAttribute("class","row");
                const tenmon =document.createElement("input");
                tenmon.placeholder = "Tên môn";
                const tinchi =document.createElement("input");
                tinchi.type = "number";
                tinchi.placeholder = "Tín chỉ";
                const xoa =document.createElement("button");
                xoa.innerText = "Xóa";
                xoa.onclick = function(){
                    myRow.remove();
                };
                myRow.appendChild(tenmon);
                myRow.appendChild(tinchi);
                myRow.appendChild(xoa);
                document.getElementById("hienthi").appendChild(myRow);
            }
            
        </script>
	</body>
</html>
